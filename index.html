<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>少年野球スコアブック</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f4d3a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="スコアブック"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>
:root{--g:#1f4d3a;--bg:#fff;--t:#1d2a24;--l:#e6efe9;--b:#9fb3a8;--a:#b8761c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14201a;--t:#e6efe9;--l:#22352b;--b:#4b6356}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.hd{background:var(--g);color:#fff;padding:8px 12px;font-weight:700}.nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;border-bottom:1px solid var(--b)}
.nav button{flex:1;padding:10px;border:0;background:none;color:var(--t);font-size:15px;border-bottom:3px solid transparent}.nav .on{border-color:var(--g);font-weight:700}
main{padding:10px;max-width:760px;margin:auto}button{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:9px 11px;margin:2px}
.p button{min-width:46%;padding:14px 6px;font-weight:700}.B{color:#1a7f45}.S{color:var(--a)}.r{color:#c0392b}.go{background:var(--g);color:#fff;border-color:var(--g)}
.card{border:1px solid var(--b);border-radius:10px;padding:10px;margin:8px 0;background:var(--l)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.d{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--b);margin:0 2px;vertical-align:middle}.d.B{background:#1a7f45}.d.S{background:var(--a)}.d.O{background:#c0392b}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--b);padding:3px 5px;text-align:center;font-size:13px}th{background:var(--g);color:#fff}.w{overflow-x:auto}td.n{text-align:left;white-space:nowrap}td.cur{background:#f6e7c8;color:#222}
textarea,input,select{font:inherit;width:100%;padding:6px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t)}textarea{height:140px}pre{white-space:pre-wrap;margin:0;font:inherit}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;display:none}
@page{size:A4 portrait;margin:8mm}@media print{:root{--bg:#fff;--t:#1d2a24;--l:#e6efe9;--b:#9fb3a8;--cw:50px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ui{display:none!important}main{max-width:none;padding:0}body{font-size:10px}th,td{font-size:9px;padding:1px 2px}.w{overflow:visible}svg{width:48px;height:48px}h3{font-size:12px}.pb{page-break-before:always}}</style></head><body>
<div class="hd ui" id="ttl"></div><div class="nav ui" id="nav"></div><main id="v"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),D0=`佐藤,57,捕
鈴木,2,一
高橋,52,遊
田中,7,中
伊藤,13,二
渡辺,50,三
山本,17,投
中村,31,左
小林,16,右`,D1=`加藤,21,一
吉田,32,遊
石川,31,三
松本,24,中
井上,33,捕
木村,26,二
林,22,右
清水,20,投
山崎,35,左`,K='sb1';
const P=t=>t.trim().split('\n').map(x=>{const a=x.split(',');return{n:a[0].trim(),no:(a[1]||'').trim(),p:(a[2]||'').trim()}});
const init=()=>({info:{t:'秋季大会 1回戦',d:new Date().toISOString().slice(0,10),pl:'',st:''},teams:[{n:'サンプル少年団',c:'山田',l:P(D0)},{n:'ミナミクラブ',c:'田中',l:P(D1)}],inn:1,h:0,o:0,b:0,s:0,bs:[null,null,null],sc:[[0],[0]],ix:[0,0],pc:[{},{}],cl:{},rp:[],sb:[],done:0,bk:[null,null,null],dm:{},pt:[{},{}]});
let S,H=[],tab=0,FD=[];try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||init();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cu=()=>S.teams[S.h].l[S.ix[S.h]],pn=()=>{const p=S.teams[1-S.h].l.find(x=>x.p=='投');return p?p.n:'投手'};
const tot=t=>S.sc[t].reduce((a,b)=>a+b,0),rt=b=>{const x=['一','二','三'].filter((_,i)=>b[i]);return x.length==0?'ランナーなし':x.length==3?'満塁':x.join('・')+'塁'};
function act(f){if(!S.t0)S.t0=Date.now();H.push(JSON.stringify(S));if(H.length>300)H.shift();f();save();render()}
function undo(){if(H.length){S=JSON.parse(H.pop());save();render()}}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',1500)}
function cp(t){const f=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};try{navigator.clipboard.writeText(t).catch(f)}catch(e){f()}toast('コピーしました')}
function change(){S.o=0;S.bs=[null,null,null];if(S.h){S.inn++;S.h=0}else S.h=1;S.sc.forEach(a=>{while(a.length<S.inn)a.push(0)})}
function pitch(t){if(S.done)return;act(()=>{const k=pn(),c=S.pc[1-S.h];c[k]=(c[k]||0)+1;
if(t=='B'){if(++S.b>=4)res('四球')}else if(t=='F'){if(S.s<2)S.s++}else if(++S.s>=3)res('三振')})}
function res(r){const h=S.h,m=cu(),bs=S.bs,key=h+'_'+S.ix[h]+'_'+S.inn;let run=0,nb=bs.slice();
const mv=n=>{const x=[null,null,null];for(let i=2;i>=0;i--)if(bs[i]){const t=i+n;t>2?run++:x[t]=bs[i]}return x},HT={'単打':1,'二塁打':2,'三塁打':3};
if(HT[r]){const n=HT[r];nb=mv(n);nb[n-1]=m.n}
else if(r=='本塁打'){run=bs.filter(x=>x).length+1;nb=[null,null,null]}
else if(r=='四球'||r=='死球'){if(bs[0]){if(bs[1]){if(bs[2])run++;nb[2]=bs[1]}nb[1]=bs[0]}nb[0]=m.n}
else if(r=='失策'){nb=mv(1);nb[0]=m.n}
else if(r=='野選'){const i=bs[0]?0:bs[1]?1:bs[2]?2:-1;if(i>=0){nb[i]=null;S.o++}nb[0]=m.n}
else{S.o++;if(r=='犠打')nb=mv(1);if(r=='犠飛'&&bs[2]&&S.o<3){run++;nb[2]=null}}
if(S.o>=3)run=0;S.sc[h][S.inn-1]+=run;(S.cl[key]=S.cl[key]||[]).push(r);S.bs=nb;
let t=`${S.inn}回${h?'裏':'表'} ${S.teams[h].n}の攻撃\n${S.ix[h]+1}番 ${m.n}：${r}${run?`（${run}点）`:''}\n${S.o}アウト ${rt(nb)}`;
if(run)t+=`\n${S.teams[0].n} ${tot(0)} - ${tot(1)} ${S.teams[1].n}`;
S.ix[h]=(S.ix[h]+1)%S.teams[h].l.length;S.b=S.s=0;if(S.o>=3){t+='\nスリーアウトチェンジ';change()}S.rp.push(t)}
function rn(i,t){act(()=>{const n=S.bs[i],h=S.h;let x=t;if(t=='アウト'){S.bs[i]=null;S.o++}else if(i==2){S.bs[2]=null;S.sc[h][S.inn-1]++;x='生還'}else{if(S.bs[i+1])return;S.bs[i+1]=n;S.bs[i]=null}
let s=`${S.inn}回${h?'裏':'表'} ${S.teams[h].n}\n${n}：${x}\n${S.o}アウト ${rt(S.bs)}`;if(x=='生還')s+=`\n${S.teams[0].n} ${tot(0)} - ${tot(1)} ${S.teams[1].n}`;
if(S.o>=3){s+='\nスリーアウトチェンジ';change()}S.rp.push(s)})}
function sub(){const h=+$('#st').value,i=+$('#so').value-1,l=S.teams[h].l,o=l[i],n={n:$('#sn').value.trim(),no:$('#sm').value.trim(),p:$('#sp').value.trim()};if(!n.n)return toast('選手名を入力');
act(()=>{S.sb.push(`${S.inn}回${S.h?'裏':'表'} ${S.teams[h].n} ${i+1}番 ${o.n}(${o.p}) → ${n.n}(${n.p||o.p})`);if(!n.p)n.p=o.p;l[i]=n;S.rp.push(`選手交代 ${S.teams[h].n}\n${i+1}番 ${o.n} → ${n.n}（${n.p}）`)})}
function newGame(){if(!confirm('現在の試合記録を破棄して新規試合を開始しますか？'))return;const g=init(),v=i=>$(i).value;g.info={t:v('#it'),d:v('#id'),pl:v('#ip'),st:v('#is')};
[0,1].forEach(t=>{g.teams[t].n=v('#n'+t);g.teams[t].c=v('#c'+t);g.teams[t].l=P(v('#l'+t))});S=g;H=[];save();tab=0;render()}
function exp(){return JSON.stringify({schema:'scorebook/1',info:S.info,teams:S.teams,runs:S.sc,total:[tot(0),tot(1)],plays:S.cl,pitchCount:S.pc,subs:S.sb,finished:!!S.done},null,1)}
function bookH(t){const T=S.teams[t],N=Math.max(6,S.inn),op=S.pc[1-t],ps=Object.entries(op).map(([k,v])=>k+' '+v+'球').join(' / ')||'-';
let h=`<h3 style="margin:10px 0 4px">${t?'後攻':'先攻'} ${T.n} <small>監督 ${T.c}</small></h3><div class=w><table><tr><th>打順<th>選手名<th>背番号<th>守備`;for(let i=1;i<=N;i++)h+=`<th>${i}`;h+='</tr>';
T.l.forEach((p,b)=>{h+=`<tr><td>${b+1}<td class=n>${p.n}<td>${p.no}<td>${p.p}`;for(let i=1;i<=N;i++){const c=S.cl[t+'_'+b+'_'+i]||[],cur=!S.done&&S.h==t&&S.ix[t]==b&&S.inn==i;h+=`<td class="${cur?'cur':''}">${c.join('<br>')}`}h+='</tr>'});
return h+`</table></div><small>相手投手: ${ps}</small>`}
function sbH(){const N=Math.max(window.PR?9:6,S.inn);let h='<div class=w><table><tr><th>チーム';for(let i=0;i<N;i++)h+=`<th>${i+1}`;h+='<th>計</tr>';
[0,1].forEach(t=>{h+=`<tr><td class=n>${S.teams[t].n}`;for(let i=0;i<N;i++)h+=`<td>${S.done||i<S.inn-1||(i==S.inn-1&&t<=S.h)?S.sc[t][i]??'':''}`;h+=`<td><b>${tot(t)}</b></tr>`});return h+'</table></div>'}
const dots=(n,c,m)=>Array.from({length:m},(_,i)=>`<i class="d ${i<n?c:''}"></i>`).join('');
const bs=(x,cx,cy)=>`<rect x="${cx-9}" y="${cy-9}" width="18" height="18" transform="rotate(45 ${cx} ${cy})" fill="${x?'#b8761c':'none'}" stroke="currentColor" opacity="${x?1:.5}"/>${x?`<text x="${cx}" y="${cy-15}" font-size="11" text-anchor="middle" fill="currentColor">${x}</text>`:''}`;
function vIn(){const m=cu(),T=S.teams[S.h],pc=S.pc[1-S.h][pn()]||0,rb=['一','二','三'];
const R=[['単打','二塁打','三塁打','本塁打'],['ゴロ','フライ','ライナー','ファウルフライ','インフィールドフライ','併殺'],['犠打','犠飛','失策','野選','死球','申告敬遠']];
return `${sbH()}${window.clk?`<div class=card><small id=clk>${clk()}</small><br><small>${S.teams[S.h].n} 攻撃タイム ${tmv(S.h,1)}/3　／　${S.teams[1-S.h].n} 守備タイム ${tmv(1-S.h,0)}/3</small><br><button onclick="tmo(S.h,1)">攻撃タイム</button><button onclick="tmo(1-S.h,0)">守備タイム</button><button onclick="copyImg()">塁の状況を画像でコピー</button>${plw()}</div>`:''}${window.orderH?orderH():''}${window.pstH?`<small>投手成績（${S.teams[1-S.h].n}）</small>${pstH(1-S.h)}`:''}<div class=card><div class=row><svg width=130 height=105 viewBox="0 0 130 105">${bs(S.bs[1],65,24)+bs(S.bs[0],100,56)+bs(S.bs[2],30,56)}<path d="M65 80l8 -8v-6h-16v6z" fill="none" stroke="currentColor"/></svg>
<div><b>${S.inn}回${S.h?'裏':'表'} ${T.n}の攻撃</b><br>B ${dots(S.b,'B',3)}<br>S ${dots(S.s,'S',2)}<br>O ${dots(S.o,'O',2)}</div></div>
<div>打者 <b>${S.ix[S.h]+1}番 ${m.n}</b>（${m.no}）　投手 ${pn()} <b>${pc}球</b></div></div>
<div class=p><button class=B onclick="pitch('B')">ボール (B)</button><button class=S onclick="pitch('S')">見逃し (S)</button><button class=S onclick="pitch('K')">空振り (K)</button><button onclick="pitch('F')">ファウル (F)</button><button onclick="pitch('BF')">バントファウル</button><button onclick="pk()">牽制</button></div>
<h4 style="margin:10px 0 2px">守備（先に押す）</h4><div>${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="FD.push(${n});render()">${n}</button>`).join('')}<button onclick="FD=[];render()">消</button> <b>${FD.join('-')||'—'}</b></div><small>1投 2捕 3一 4二 5三 6遊 7左 8中 9右。ゴロは6→3で6-3、フライは8で中飛、安打は打球方向を押す</small><h4 style="margin:10px 0 2px">打席の結果</h4>${R.map(g=>g.map(x=>`<button onclick="inplay('${x}')">${x}</button>`).join('')).join('<br>')}
<br><button onclick="inplay('単打','T')">テキサスヒット</button><button onclick="inplay('単打','BH')">バント安打</button><button onclick="inplay('打撃妨害')">打撃妨害</button><button onclick="inplay('守備妨害')">守備妨害</button><button onclick="inplay('振り逃げ暴投')">振り逃げ(暴投)</button><button onclick="inplay('振り逃げ捕逸')">振り逃げ(捕逸)</button><h4 style="margin:10px 0 2px">走者の動き</h4>${S.bs.some(x=>x)?`<div>全走者: <button onclick="rnAll('暴投')">暴投</button><button onclick="rnAll('捕逸')">捕逸</button><button onclick="rnAll('ボーク')">ボーク</button><button onclick="rnAll('ダブルスチール')">ダブルスチール</button></div>`:''}${S.bs.map((n,i)=>n?`<div>${rb[i]}塁 ${n} ${['盗塁','暴投','捕逸','ボーク','進塁','失策進塁','走塁妨害'].map(x=>`<button onclick="rn(${i},'${x}')">${x}</button>`).join('')}<button class=r onclick="rn(${i},'盗塁死')">盗塁死</button><button class=r onclick="rn(${i},'牽制死')">牽制死</button><button class=r onclick="rn(${i},'アウト')">アウト</button></div>`:'').join('')||'<small>走者なし</small>'}
<div style="margin-top:10px"><button onclick="undo()">↶ 1つ戻す</button></div><div class=card><pre>${S.rp.length?S.rp[S.rp.length-1]:'（LINE速報は打席・走者の動きごとに自動生成）'}</pre>${S.rp.length?`<button class=go onclick="cp(S.rp[S.rp.length-1])">速報をコピー</button>`:''}</div>`}
function vBook(){return `<div class=ui><button onclick="window.print()">PDF出力（印刷）</button></div><h3 style="margin:8px 0">${S.info.t} <small>${S.info.d} ${S.info.pl} ${S.info.st}</small></h3>${bookH(0)}${sbH()}${bookH(1)}`}
function vSet(){const T=S.teams,o=[1,2,3,4,5,6,7,8,9].map(i=>`<option>${i}`).join('');
return `<h4>LINE速報履歴（${S.rp.length}件）</h4><details><summary>これまでの速報</summary>${S.rp.slice().reverse().map(x=>`<div class=card><pre>${x}</pre><button onclick="cp(this.previousElementSibling.textContent)">コピー</button></div>`).join('')}</details>
<h4>選手交代</h4><div class=card><div class=row><select id=st style="width:auto"><option value=0>${T[0].n}<option value=1>${T[1].n}</select><select id=so style="width:auto">${o}</select><select id=sk style="width:auto"><option>代打<option>代走<option>投手交代<option>守備変更<option>交代</select><select id=sr style="width:auto"><option value=0>一塁走者<option value=1>二塁走者<option value=2>三塁走者</select></div><small>代打=今の打者と交代／代走=塁を選ぶ／投手交代=名前がオーダー内の選手なら守備を入れ替え／守備変更=打順と新しい守備（同じ守備の選手と自動で入れ替え）／交代=打順を選んで交代</small></div><input id=sn list=bn placeholder="新しい選手名"><datalist id=bn>${[...(DR[0]||[]),...(DR[1]||[])].map(p=>`<option>${p.n}`).join('')}</datalist><input id=sm placeholder="背番号"><input id=sp placeholder="守備（空欄=交代前と同じ）"><button class=go onclick="sub()">交代を記録</button>${S.sb.map(x=>`<div><small>${x}</small></div>`).join('')}</div>
<h4>試合終了・HOPE-SABR連携</h4><div class=card><button onclick="fin()">試合終了にする</button><button class=go onclick="cp(exp())">連携用JSONをコピー</button><button onclick="cp(csvB())">打撃CSV</button><button onclick="cp(csvP())">投手CSV</button><button onclick="cp(csvG())">試合CSV</button><button onclick="cp(csvA())">打席CSV</button><textarea readonly>${exp().replace(/</g,'&lt;')}</textarea></div>
<h4>PWA・連携</h4><div class=card><button onclick="inst()">ホーム画面に追加</button><button onclick="dl('scorebook.json',exp())">JSON書き出し</button><button onclick="dl('batting.csv',csvB())">打撃CSV</button><button onclick="dl('pitching.csv',csvP())">投手CSV</button><button onclick="dl('game.csv',csvG())">試合CSV</button><br>連携先URL（POSTでJSONを送信）<input id=sx value="${sbu()}" placeholder="https://..."><button class=go onclick="sync()">HOPE-SABRへ送信</button><br><small>未送信: ${ob().length}件。オフラインでは保留し、通信が戻ると自動で再送します。連携先はCORSを許可してください。</small></div><h4>試合ルール・その他</h4><div class=card>制限時間（分）<input id=lm type=number value="${S.lim||90}">投球数制限（球）<input id=pl type=number value="${S.pl||70}"><button onclick="act(()=>{S.lim=+$('#lm').value||90;S.pl=+$('#pl').value||70})">保存</button><button onclick="cpAll()">全速報をコピー</button><br><small>初期値は90分・70球です。大会の規定に合わせて変更してください。</small></div><h4>試合一覧</h4><div class=card><button class=go onclick="gsave()">現在の試合を保存</button>${gl().map((r,i)=>`<div class=row><span style="flex:1">${r.t}</span><button onclick="gload(${i})">開く</button><button class=r onclick="gdel(${i})">削除</button></div>`).join('')||'<small>保存した試合はありません</small>'}<br><small>この端末のブラウザに保存されます。</small><hr><button onclick="cp(bkJ())">全試合をバックアップ（コピー）</button><textarea id=bk placeholder="バックアップのJSONを貼り付け"></textarea><button class=go onclick="rest()">復元（保存済み試合に追加）</button></div><h4>HOPE-SABRから選手取得</h4><div class=card><small>HOPE-SABRの選手一覧（CSV「名前,背番号,守備」またはJSON）を貼り付けると、下のオーダー欄に読み込みます。</small><select id=rt style="width:auto"><option value=0>先攻<option value=1>後攻</select><textarea id=rs placeholder="名前,背番号,守備"></textarea><button class=go onclick="imp()">取得してオーダー欄へ</button></div><h4>試合情報・オーダー（確定で新規試合）</h4><div class=card><input id=it value="${S.info.t}"><input id=id value="${S.info.d}"><input id=ip placeholder="会場" value="${S.info.pl}"><input id=is placeholder="試合開始" value="${S.info.st}">
${[0,1].map(t=>`<b>${t?'後攻':'先攻'}</b><input id=n${t} value="${T[t].n}"><input id=c${t} placeholder="監督" value="${T[t].c}"><textarea id=l${t}>${(DR[t]||T[t].l).map(p=>[p.n,p.no,p.p].join(',')).join('\n')}</textarea>`).join('')}<small>1行1人・打順順「名前,背番号,守備」（投手は守備を「投」）</small><br><button class=r onclick="newGame()">この内容で新規試合を開始</button></div>`}

async function push(){const u=sbu(),q=ob();if(!u||!q.length||!navigator.onLine)return;const rest=[];for(const j of q){try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:j});if(!r.ok)throw 0}catch(e){rest.push(j)}}lss('sbo',rest);toast(rest.length?'未送信が残っています':'送信しました');if(tab==2)render()}
function sync(){const u=$('#sx').value.trim();if(!u)return toast('連携先URLを入力してください');lss('sbu',u);const q=ob();q.push(exp());lss('sbo',q);push()}
addEventListener('online',push);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
